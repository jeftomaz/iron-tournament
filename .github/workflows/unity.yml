name: Unity CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-editmode-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: Library-editmode-${{ runner.os }}-
      - name: Run EditMode tests
        env:
          UNITY_EXECUTABLE: /Applications/Unity/Hub/Editor/6000.5.7f1/Unity.app/Contents/MacOS/Unity
        run: |
          mkdir -p artifacts
          "$UNITY_EXECUTABLE" -batchmode -quit -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode -testResults "$GITHUB_WORKSPACE/artifacts/editmode-results.xml"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: artifacts/editmode-results.xml
          retention-days: 7

  build:
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-webgl-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: Library-webgl-${{ runner.os }}-
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          buildName: IronTournament
          skipActivation: true
          runAsHostUser: true
      - uses: actions/upload-artifact@v4
        with:
          name: webgl
          path: build/WebGL
          retention-days: 7

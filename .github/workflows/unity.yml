name: Unity CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      unity: ${{ steps.scope.outputs.unity }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD^1 HEAD^2 | grep -Eq '^(\.github/workflows/unity\.yml|Assets/|Packages/|ProjectSettings/)'; then
            echo "unity=true" >> "$GITHUB_OUTPUT"
          else
            echo "unity=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.unity == 'true') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-EditMode-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-${{ runner.os }}-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          githubToken: ''
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 7

  build:
    needs: [changes, test]
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.unity == 'true') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-${{ runner.os }}-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: IronTournament
      - uses: actions/upload-artifact@v4
        with:
          name: webgl
          path: build/WebGL
          retention-days: 7
